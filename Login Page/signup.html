<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn math interactively with engaging lessons, quizzes, and progress tracking. Perfect for students and lifelong learners!">
    <meta name="keywords" content="Maths learning, Interactive lessons, Maths Quizzes, Maths Worksheets, Maths Online education">
    <meta name="author" content="Hsu Lin Latt Naing, Anastasia Krynytska, Tien Dung Pham">
    <title>MathsLearn | Sign Up</title>
    <link rel="icon" href="images/maths.png" type="image/png">
    <link rel="stylesheet" href="styles/signup.css" type="text/css">
    <link rel="stylesheet" href="styles/normalize.css" type="text/css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <a href="../Home Page/index.html" class="logo">📚 MathsLearn</a>
        <input type="checkbox" id="menu-bar"> 
        <label for="menu-bar"><i class="fa-solid fa-bars"></i></label>
        <nav>
            <ul class="navigation">
                <li><a href="../Home Page/index.html" class="nav-links">Home</a></li>
                <li><a href="../Lessons Page/interactive.html" class="nav-links">Lessons</a></li>
                <li><a href="../Quizz/Quizz.html" class="nav-links">Quizzes</a></li>
                <li><a href="../Layout Worksheet/Worksheet page.html" class="nav-links">Worksheets</a></li>
                <li><a href="../Home Page/index.html#contact" class="nav-links">Contact</a></li>
                <li><a href="#" class="nav-links"><i class="fa-solid fa-user"></i></a>
                    <ul class="user-profile">
                        <li> <a href="../Account Page/Pages/account.html" class="nav-links"> Profile </a> </li>
                        <li> <a href="../Account Page/Pages/progress.html" class="nav-links"> Progress </a> </li>
                        <li> <a href="#" class="nav-links"> Settings </a> </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="sign-up">
            <div class="signup-container">
              <h2>Join MathsLearn ✨</h2>
              <p>Create your account below</p>
      
              <form class="signup-form" action="../Account Page/Pages/account.html" method="get">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Your Name" />
      
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
      
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a password" autocomplete="new-password" />
      
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Re-enter your password" />
      
                <button type="submit">Create Account</button>
              </form>
      
              <p class="note">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 MathsLearn. All Rights Reserved to HAT.</p>
    </footer>
</body>
</html>
